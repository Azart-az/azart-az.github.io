name: Create Thumbs

on:
  push:
    paths:
      - 'images/**'
  workflow_dispatch:

jobs:
  create-thumbs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install sharp
        run: npm install sharp

      - name: Create thumbs
        run: node create-thumbs.js

      - name: Commit thumbs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbs/
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "Auto: create/update thumbs"
            git push
          fi
