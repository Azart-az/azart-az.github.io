name: Generate Thumbnails

on:
  push:
    branches: [ main ]
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-thumbs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install ImageMagick
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick

      - name: Create thumbs folder and generate thumbnails
        run: |
          mkdir -p thumbs

          find images -type f \( -iname "*.jpg" -o -iname "*.jpeg" -o -iname "*.png" -o -iname "*.webp" \) | while read -r file; do
            filename=$(basename "$file")
            if [ ! -f "thumbs/$filename" ] || [ "$file" -nt "thumbs/$filename" ]; then
              echo "Creating thumb: $filename"
              convert "$file" -resize 400x -quality 80 "thumbs/$filename"
            fi
          done

      - name: Commit and push thumbs (if any changes)
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add thumbs/
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto: generate/update thumbnails"
            git push
          fi
